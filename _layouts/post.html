---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <!-- POST CONTENT -->
  <div class="post-content" id="post-content">
    {{ content }}
  </div>

  <!-- AD UNIT AFTER FULL CONTENT -->
  <div class="ad-after-content">
<ins class="adsbygoogle"
     style="display:block; text-align:center;"
     data-ad-layout="in-article"
     data-ad-format="fluid"
     data-ad-client="ca-pub-2996839415438815"
     data-ad-slot="1683500377"></ins>
    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

</article>

<!-- ✅ FIXED — AD AFTER 2nd PARAGRAPH (AUTO INSERT) -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const content = document.getElementById("post-content");
  if (!content) return;

  const paragraphs = content.getElementsByTagName("p");
  if (paragraphs.length >= 2) {

    // ✅ CORRECT WAY — Create elements manually, never use innerHTML for scripts
    const wrapper = document.createElement("div");
    wrapper.style.margin = "30px 0";

    const ins = document.createElement("ins");
ins.style.display = "block";
ins.style.textAlign = "center";
ins.setAttribute("data-ad-layout", "in-article");
ins.setAttribute("data-ad-format", "fluid");
ins.setAttribute("data-ad-client", "ca-pub-2996839415438815");
ins.setAttribute("data-ad-slot", "1683500377");
    wrapper.appendChild(ins);
    paragraphs[1].after(wrapper);

    // ✅ Push ad after element is in DOM
    (adsbygoogle = window.adsbygoogle || []).push({});
  }
});
</script>
