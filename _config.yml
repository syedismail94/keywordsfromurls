title: Happy Home & Living
description: Home Decor, Fashion, Gardening & Parenting Blog

# ✅ Custom Domain URL
url: "https://keywordsfromurls.com"
baseurl: ""

remote_theme: mmistakes/minimal-mistakes

plugins:
  - jekyll-include-cache
  - jekyll-sitemap

minimal_mistakes_skin: default

markdown: kramdown

# ✅ Clean SEO-friendly URLs
permalink: /:title/

# ✅ Disable sidebar globally
sidebar:
  nav: false

# ✅ THIS IS THE FIX — Add defaults section
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      classes: wide
      toc: true
      toc_sticky: true
      toc_label: "In This Article"
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      classes: wide

# ✅ Footer links
footer:
  links:
    - label: "About Us"
      url: /about/
    - label: "Contact Us"
      url: /contact/
    - label: "Privacy Policy"
      url: /privacy-policy/
    - label: "Disclaimer"
      url: /disclaimer/

# ✅ Custom CSS
custom_css:
  - assets/css/custom.css
